name: Backend tests
on:
  push:
    branches: [main, feat/case-building-grounded-actions-benchmarks]
  pull_request:
    branches: [main, feat/case-private-conversation-mode]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q
